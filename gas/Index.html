<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16002f">
  <title>図形のへんしん実験室</title>
  <style>
:root {
  color-scheme: light;
  --ink: #24343b;
  --subtle: #65747a;
  --paper: #f7f5ef;
  --surface: #ffffff;
  --line: #d7dedb;
  --sky: #dceef3;
  --sky-deep: #4b7c8c;
  --sun: #f3bf51;
  --focus: #0d667b;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-width: 320px;
  min-height: 100dvh;
  background: var(--paper);
  color: var(--ink);
}

button, textarea { font: inherit; }

button {
  min-height: 48px;
  border: 0;
  border-radius: 16px;
  padding: 10px 18px;
  color: var(--ink);
  background: var(--surface);
  box-shadow: 0 2px 0 rgba(36, 52, 59, 0.14);
  font-weight: 700;
  cursor: pointer;
}

button:focus-visible, textarea:focus-visible {
  outline: 4px solid var(--focus);
  outline-offset: 3px;
}

button:active { transform: translateY(1px); box-shadow: none; }

.app-shell {
  width: min(100%, 760px);
  min-height: 100dvh;
  margin: 0 auto;
  padding: clamp(20px, 5vw, 40px) clamp(18px, 6vw, 48px) 28px;
  display: flex;
  flex-direction: column;
}

.home { justify-content: center; gap: 28px; }

.eyebrow {
  margin: 0 0 8px;
  color: var(--sky-deep);
  font-size: 0.95rem;
  font-weight: 800;
  letter-spacing: 0.08em;
}

h1, h2, p { margin-top: 0; }
h1 { margin-bottom: 8px; font-size: clamp(2rem, 8vw, 3.3rem); line-height: 1.18; }
h2 { margin-bottom: 10px; font-size: clamp(1.55rem, 6vw, 2.2rem); line-height: 1.3; }

.lead, .prompt { color: var(--subtle); font-size: clamp(1.05rem, 4vw, 1.25rem); line-height: 1.7; }

.lesson-card {
  width: 100%;
  min-height: 172px;
  padding: 24px;
  text-align: left;
  background: var(--surface);
  border: 2px solid var(--line);
  box-shadow: 0 5px 0 rgba(36, 52, 59, 0.1);
}

.lesson-card__icon {
  display: inline-grid;
  place-items: center;
  width: 48px;
  height: 48px;
  margin-bottom: 12px;
  border-radius: 50%;
  color: var(--sky-deep);
  background: var(--sky);
  font-size: 2rem;
  font-weight: 400;
}

.lesson-card__title { display: block; font-size: 1.45rem; }
.lesson-card__meta { display: block; margin-top: 4px; color: var(--subtle); font-weight: 600; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topbar__actions { display: flex; align-items: center; gap: 8px; }
.back { padding-inline: 14px; background: transparent; box-shadow: none; }
.next { min-height: 42px; padding-inline: 13px; border: 1px solid var(--line); box-shadow: none; }
.help { width: 48px; padding: 0; border-radius: 50%; background: var(--sky); color: var(--ink); }

.intro { justify-content: center; gap: 24px; }
.intro__body { max-width: 560px; }
.primary { width: 100%; background: var(--sun); font-size: 1.2rem; }
.secondary { background: var(--surface); border: 1px solid var(--line); }

.work { gap: 18px; padding-bottom: 104px; }
.work.psychedelic { background: var(--psy-bg); color: var(--psy-text); }
.work.psychedelic .work__question { color: var(--psy-text); }
.work__question { margin: 8px 4px 0; font-size: clamp(1.2rem, 5vw, 1.65rem); font-weight: 800; line-height: 1.55; }

.stage {
  position: relative;
  flex: 1;
  min-height: 400px;
  overflow: hidden;
  border: 2px solid var(--line);
  border-radius: 24px;
  background-color: var(--psy-bg, var(--surface));
  background-image: radial-gradient(circle, rgba(255,255,255,.24) 1px, transparent 1.5px);
  background-size: 22px 22px;
  touch-action: none;
}

.stage__svg,
.stage__ink {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.stage__svg { overflow: visible; }
.stage__ink { pointer-events: none; touch-action: none; }
.stage--pen .stage__svg { pointer-events: none; }
.stage--pen .stage__ink { pointer-events: auto; cursor: crosshair; }
.radius-arm { stroke: var(--psy-arm, var(--sky-deep)); stroke-width: 9; stroke-linecap: round; cursor: crosshair; }
.radius-arm:active { cursor: grabbing; }
.placed-dot { fill: var(--psy-point, #db8a4e); stroke: #fff; stroke-width: 4; }
.revealed-circle { fill: none; stroke: var(--sky-deep); stroke-width: 4; stroke-dasharray: 11 10; }
.guide-line { stroke: #8faeb8; stroke-width: 4; stroke-dasharray: 9 9; pointer-events: none; }
.circle-line { fill: rgba(220, 238, 243, 0.32); stroke: var(--sky-deep); stroke-width: 5; cursor: grab; }
.circle-line:active { cursor: grabbing; }
.handle { stroke: none; cursor: grab; }
.handle:active, .probe:active { cursor: grabbing; }
.handle--centre { fill: var(--psy-point, var(--sun)); }
.handle--radius { fill: var(--psy-arm, #4b7c8c); }
.probe { fill: #8eb766; stroke: var(--surface); stroke-width: 4; cursor: grab; }
.probe--on-circle { fill: #db8a4e; }

.stage__hint {
  position: absolute;
  right: 14px;
  bottom: 14px;
  max-width: 210px;
  margin: 0;
  padding: 12px 14px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.92);
  color: var(--subtle);
  font-size: 0.94rem;
  line-height: 1.5;
  pointer-events: none;
}

.stage__count { position: absolute; left: 18px; bottom: 14px; margin: 0; color: var(--psy-text, var(--ink)); font-weight: 800; pointer-events: none; }
.enter-hint { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); display: grid; gap: 2px; min-width: 148px; padding: 16px 14px; border: 3px solid var(--psy-point); border-radius: 18px; background: rgba(0,0,0,.22); color: var(--psy-text); text-align: center; pointer-events: none; }
.enter-hint strong { color: var(--psy-point); font-size: clamp(1.6rem, 5vw, 2.3rem); letter-spacing: .05em; }
.enter-hint span { font-size: 1.05rem; font-weight: 800; }

.discover-button {
  position: absolute;
  right: 14px;
  bottom: 14px;
  max-width: 230px;
  min-height: 46px;
  background: var(--sun);
  box-shadow: 0 2px 0 rgba(36, 52, 59, 0.14);
  font-size: 0.95rem;
}

.tool-dock {
  position: fixed;
  right: max(14px, calc((100vw - 760px) / 2 + 18px));
  bottom: max(14px, env(safe-area-inset-bottom));
  left: max(14px, calc((100vw - 760px) / 2 + 18px));
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 8px 24px rgba(36, 52, 59, 0.14);
}

.tool-dock button { min-width: 0; padding-inline: 8px; font-size: 0.95rem; }
.tool-dock button[aria-pressed="true"] { color: white; background: var(--sky-deep); }

.summary { gap: 18px; }
.summary__body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.summary__actions { display: grid; gap: 10px; }
textarea {
  width: 100%;
  min-height: 180px;
  resize: vertical;
  padding: 16px;
  border: 2px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  color: var(--ink);
  line-height: 1.7;
}

.dialog {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(36, 52, 59, 0.35);
}

.dialog__panel {
  width: min(100%, 420px);
  padding: 28px;
  border-radius: 24px;
  background: var(--surface);
  box-shadow: 0 18px 40px rgba(36, 52, 59, 0.25);
}

.dialog__panel p { line-height: 1.7; }

@media (max-width: 430px) {
  .tool-dock button { font-size: 0.85rem; }
  .stage { min-height: 360px; }
}

  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script>
const BOX={width:700,height:460};
const lessons=[{id:'circle-01',title:'円のひみつ 1',meta:'同じ長さの点を集めよう',prompt:'黄色の点から、青い棒と同じ長さのところに 点をうとう。',reflectionPrompt:'黄色の点から同じ長さのところに点を打つと、どんな形になった？'}];
const palettes=[{bg:'#16002f',point:'#ffe600',arm:'#21f3c4',text:'#fff'},{bg:'#ff145b',point:'#00ffe1',arm:'#1700ff',text:'#fff'},{bg:'#00d9a6',point:'#5c00ff',arm:'#ffea00',text:'#102a2b'},{bg:'#ff6a00',point:'#00eaff',arm:'#1900ff',text:'#fff'}];
const initialGeometry=()=>({center:{x:350,y:230},radiusPoint:{x:500,y:230}}); const app=document.querySelector('#app');
const state={screen:'home',lesson:lessons[0],activeTool:'move',reflection:'',helpOpen:false,geometry:initialGeometry(),dots:[],strokes:[],history:[],palette:palettes[0],completionTimer:null,lastPlacedAt:0,keyHeld:false};
const clamp=(v,min,max)=>Math.min(max,Math.max(min,v)); const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y); const copyGeometry=()=>JSON.parse(JSON.stringify(state.geometry)); const escapeHtml=v=>v.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function render(){app.innerHTML={home:renderHome,intro:renderIntro,work:renderWork,summary:renderSummary}[state.screen]();bindEvents();}
function renderHome(){return `<section class="app-shell home"><div><p class="eyebrow">さんすう</p><h1>図形のへんしん<br>実験室</h1><p class="lead">うごかして、みつけよう。</p></div><div>${lessons.map(l=>`<button class="lesson-card" data-action="open-lesson" data-lesson-id="${l.id}"><span class="lesson-card__icon">○</span><span class="lesson-card__title">${l.title}</span><span class="lesson-card__meta">${l.meta}</span></button>`).join('')}</div></section>`;}
function renderIntro(){return `<section class="app-shell intro"><div class="topbar"><button class="back" data-action="go-home">← もどる</button></div><div class="intro__body"><p class="eyebrow">さんすう　円</p><h2>${state.lesson.title}</h2><p class="prompt">${state.lesson.prompt}</p></div><button class="primary" data-action="start-work">はじめる</button></section>`;}
function renderWork(){const c=state.geometry.center,p=state.geometry.radiusPoint,dots=state.dots.map(d=>`<circle class="placed-dot" cx="${d.x}" cy="${d.y}" r="9"/>`).join('');const hint=state.activeTool==='move'?`<div class="enter-hint"><strong>ENTER</strong><span>で 点をうつ</span></div><p class="stage__count">${state.dots.length}こ</p>`:'<p class="stage__hint">ペンで しるしや ことばを かこう。</p>';return `<section class="app-shell work psychedelic" style="--psy-bg:${state.palette.bg};--psy-point:${state.palette.point};--psy-arm:${state.palette.arm};--psy-text:${state.palette.text}"><div class="topbar"><button class="back" data-action="go-intro">← もどる</button><div class="topbar__actions"><button class="next" data-action="go-summary">まとめへ</button><button class="help" data-action="open-help">?</button></div></div><p class="work__question">${state.lesson.prompt}</p><div class="stage stage--${state.activeTool}" id="stage"><svg class="stage__svg" id="geometry-svg" viewBox="0 0 700 460">${dots}<line class="radius-arm" x1="${c.x}" y1="${c.y}" x2="${p.x}" y2="${p.y}"/><circle class="handle handle--centre" cx="${c.x}" cy="${c.y}" r="16"/><circle class="handle handle--radius" cx="${p.x}" cy="${p.y}" r="17"/></svg><canvas class="stage__ink" id="ink-canvas"></canvas>${hint}</div><nav class="tool-dock"><button aria-pressed="${state.activeTool==='move'}" data-action="tool" data-tool="move">うごかす</button><button aria-pressed="${state.activeTool==='pen'}" data-action="tool" data-tool="pen">かく</button><button data-action="undo">もどす</button></nav>${state.helpOpen?'<div class="dialog"><div class="dialog__panel"><h2>つかいかた</h2><p>棒を動かして、Enterかタップで点をうとう。</p><button class="primary" data-action="close-help">わかった</button></div></div>':''}</section>`;}
function renderSummary(){return `<section class="app-shell summary"><div class="topbar"><button class="back" data-action="go-work">← もどる</button></div><div class="summary__body"><p class="eyebrow">まとめ</p><h2>分かったことを<br>書こう</h2><p class="prompt">${state.lesson.reflectionPrompt}</p><textarea id="reflection" maxlength="240" placeholder="たとえば、中心から…">${escapeHtml(state.reflection)}</textarea></div><div class="summary__actions"><button class="primary" data-action="finish">おわる</button></div></section>`;}
function bindEvents(){app.querySelectorAll('[data-action]').forEach(e=>e.addEventListener('click',()=>handleAction(e.dataset)));const r=document.querySelector('#reflection');if(r)r.addEventListener('input',e=>state.reflection=e.target.value);if(state.screen==='work')setupWorkSurface();}
function setupWorkSurface(){const stage=document.querySelector('#stage'),svg=document.querySelector('#geometry-svg'),canvas=document.querySelector('#ink-canvas');resizeAndDrawInk(canvas);if(state.activeTool==='move'){svg.addEventListener('pointermove',e=>followCursor(e,svg));svg.addEventListener('pointerdown',e=>e.preventDefault());svg.addEventListener('pointerup',e=>{if(!e.defaultPrevented)placeDot();});}else canvas.addEventListener('pointerdown',e=>beginInkStroke(e,canvas));}
function followCursor(e,svg){if(state.activeTool!=='move')return;const r=svg.getBoundingClientRect(),q={x:clamp((e.clientX-r.left)*700/r.width,0,700),y:clamp((e.clientY-r.top)*460/r.height,0,460)},c=state.geometry.center,dx=q.x-c.x,dy=q.y-c.y,l=Math.hypot(dx,dy)||1,rad=distance(c,state.geometry.radiusPoint);state.geometry.radiusPoint={x:c.x+dx/l*rad,y:c.y+dy/l*rad};const a=svg.querySelector('.radius-arm'),h=svg.querySelector('.handle--radius');a.setAttribute('x2',state.geometry.radiusPoint.x);a.setAttribute('y2',state.geometry.radiusPoint.y);h.setAttribute('cx',state.geometry.radiusPoint.x);h.setAttribute('cy',state.geometry.radiusPoint.y);if(state.keyHeld)placeDot();}
function remember(){state.history.push({geometry:copyGeometry(),dots:state.dots.map(d=>({...d})),strokes:state.strokes.length});if(state.history.length>20)state.history.shift();}
function placeDot(){const now=performance.now();if(now-state.lastPlacedAt<80)return;state.lastPlacedAt=now;const p=state.geometry.radiusPoint;if(state.dots.some(d=>distance(d,p)<22))return;remember();state.dots.push({x:p.x,y:p.y});if(state.dots.length>=18&&new Set(state.dots.map(d=>Math.floor((((Math.atan2(d.y-state.geometry.center.y,d.x-state.geometry.center.x)+Math.PI*2)%(Math.PI*2))/(Math.PI*2))*18))).size>=16)schedulePaletteChange();render();}
function schedulePaletteChange(){if(state.completionTimer)return;state.completionTimer=setTimeout(()=>{const choices=palettes.filter(p=>p.bg!==state.palette.bg);state.palette=choices[Math.floor(Math.random()*choices.length)];const r=95+Math.random()*75;state.geometry.radiusPoint={x:state.geometry.center.x+r,y:state.geometry.center.y};state.dots=[];state.completionTimer=null;render();},700);}
function beginInkStroke(e,c){e.preventDefault();remember();const st=[];const add=x=>{const r=c.getBoundingClientRect();st.push({x:x.clientX-r.left,y:x.clientY-r.top});drawInk(c,st)};add(e);c.setPointerCapture?.(e.pointerId);const move=x=>add(x);const up=()=>{state.strokes.push(st);window.removeEventListener('pointermove',move);render()};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true});}
function resizeAndDrawInk(c){const s=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=Math.max(1,r.width*s);c.height=Math.max(1,r.height*s);c.getContext('2d').setTransform(s,0,0,s,0,0);drawInk(c);}
function drawInk(c,current=[]){const x=c.getContext('2d'),r=c.getBoundingClientRect();x.clearRect(0,0,r.width,r.height);x.lineCap='round';x.lineWidth=4;x.strokeStyle='#24343b';[...state.strokes,current].forEach(st=>{if(!st.length)return;x.beginPath();st.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();});}
function undo(){const p=state.history.pop();if(!p)return;state.geometry=p.geometry;state.dots=p.dots;state.strokes=state.strokes.slice(0,p.strokes);render();}
function handleAction(d){switch(d.action){case'open-lesson':state.lesson=lessons.find(l=>l.id===d.lessonId)||lessons[0];state.screen='intro';break;case'go-home':state.screen='home';break;case'go-intro':state.screen='intro';break;case'start-work':state.screen='work';break;case'go-work':state.screen='work';break;case'go-summary':state.screen='summary';break;case'tool':state.activeTool=d.tool;break;case'undo':undo();return;case'open-help':state.helpOpen=true;break;case'close-help':state.helpOpen=false;break;case'finish':state.screen='home';break;default:return;}render();}
document.addEventListener('keydown',e=>{if(state.screen!=='work'||state.activeTool!=='move'||state.helpOpen)return;const safe=e.key==='Enter'||e.key===' '||e.code==='NumpadEnter'||(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey);if(safe){e.preventDefault();state.keyHeld=true;placeDot();}});document.addEventListener('keyup',e=>{if(e.key==='Enter'||e.key===' '||e.code==='NumpadEnter'||e.key.length===1)state.keyHeld=false;});render();

  </script>
</body>
</html>
