<!doctype html>
<!-- このファイルは src/ から build.py が作る。
     直すのは src/ のほう。ここを直しても次のビルドで消える。 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<title>図形のへんしん実験室</title>
<style>
/* 色・文字の元になる変数と、要素の土台だけ。部品は app.css。 */

:root {
  color-scheme: light;
  --ink: #24343b;
  --subtle: #65747a;
  --paper: #f7f5ef;
  --surface: #ffffff;
  --line: #d7dedb;
  --sky: #dceef3;
  --sky-deep: #4b7c8c;
  --sun: #f3bf51;
  --focus: #0d667b;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-width: 320px;
  min-height: 100dvh;
  background: var(--paper);
  color: var(--ink);
}

button, textarea { font: inherit; }

button {
  min-height: 48px;
  border: 0;
  border-radius: 16px;
  padding: 10px 18px;
  color: var(--ink);
  background: var(--surface);
  box-shadow: 0 2px 0 rgba(36, 52, 59, 0.14);
  font-weight: 700;
  cursor: pointer;
}

button:focus-visible, textarea:focus-visible {
  outline: 4px solid var(--focus);
  outline-offset: 3px;
}

button:active { transform: translateY(1px); box-shadow: none; }

h1, h2, p { margin-top: 0; }
h1 { margin-bottom: 8px; font-size: clamp(2rem, 8vw, 3.3rem); line-height: 1.18; }
h2 { margin-bottom: 10px; font-size: clamp(1.55rem, 6vw, 2.2rem); line-height: 1.3; }

.eyebrow {
  margin: 0 0 8px;
  color: var(--sky-deep);
  font-size: 0.95rem;
  font-weight: 800;
  letter-spacing: 0.08em;
}

.lead, .prompt { color: var(--subtle); font-size: clamp(1.05rem, 4vw, 1.25rem); line-height: 1.7; }

.primary { width: 100%; background: var(--sun); font-size: 1.2rem; }
.secondary { background: var(--surface); border: 1px solid var(--line); }

.startup-message {
  min-height: 100dvh;
  display: grid;
  place-content: center;
  padding: 24px;
  text-align: center;
  color: var(--subtle);
  font-weight: 700;
}

.startup-message p { margin-bottom: 8px; }
/* 画面・部品の見た目。変数と要素の土台は tokens.css。 */

.app-shell {
  width: min(100%, 760px);
  min-height: 100dvh;
  margin: 0 auto;
  padding: clamp(20px, 5vw, 40px) clamp(18px, 6vw, 48px) 28px;
  display: flex;
  flex-direction: column;
}

.home { justify-content: center; gap: 28px; }
.lesson-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }

.lesson-card {
  width: 100%;
  min-height: 172px;
  padding: 24px;
  text-align: left;
  background: var(--surface);
  border: 2px solid var(--line);
  box-shadow: 0 5px 0 rgba(36, 52, 59, 0.1);
}

.lesson-card__icon {
  display: inline-grid;
  place-items: center;
  width: 48px;
  height: 48px;
  margin-bottom: 12px;
  border-radius: 50%;
  color: var(--sky-deep);
  background: var(--sky);
  font-size: 2rem;
  font-weight: 400;
}

.lesson-card__title { display: block; font-size: 1.45rem; }
.lesson-card__meta { display: block; margin-top: 4px; color: var(--subtle); font-weight: 600; }

.lesson-card:nth-child(2) .lesson-card__icon {
  color: #14798b;
  background: radial-gradient(circle at 32% 25%, #fff9c9 0 8%, #61d5c5 22%, #14798b 62%, #073852 100%);
  box-shadow: inset -7px -8px 10px rgba(0, 24, 46, .35), 0 5px 9px rgba(36, 52, 59, .18);
}

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topbar__actions { display: flex; align-items: center; gap: 8px; }
.back { padding-inline: 14px; background: transparent; box-shadow: none; }
.next { min-height: 42px; padding-inline: 13px; border: 1px solid var(--line); box-shadow: none; }
.help { width: 48px; padding: 0; border-radius: 50%; background: var(--sky); color: var(--ink); }

.intro { justify-content: center; gap: 24px; }
.intro__body { max-width: 560px; }

.work { gap: 18px; padding-bottom: 104px; }
.work.psychedelic { background: var(--psy-bg); color: var(--psy-text); }
.work.psychedelic .work__question { color: var(--psy-text); }
.work__question { margin: 8px 4px 0; font-size: clamp(1.2rem, 5vw, 1.65rem); font-weight: 800; line-height: 1.55; }

.stage {
  position: relative;
  flex: 1;
  min-height: 400px;
  overflow: hidden;
  border: 2px solid var(--line);
  border-radius: 24px;
  background-color: var(--psy-bg, var(--surface));
  background-image: radial-gradient(circle, rgba(255,255,255,.24) 1px, transparent 1.5px);
  background-size: 22px 22px;
  touch-action: none;
}

.stage__svg,
.stage__ink {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.stage__svg { overflow: visible; }
.stage__ink { pointer-events: none; touch-action: none; }
.stage--pen .stage__svg { pointer-events: none; }
.stage--pen .stage__ink { pointer-events: auto; cursor: crosshair; }
.radius-arm { stroke: var(--psy-arm, var(--sky-deep)); stroke-width: 9; stroke-linecap: round; cursor: crosshair; }
.radius-arm:active { cursor: grabbing; }
.placed-dot { fill: var(--psy-point, #db8a4e); stroke: #fff; stroke-width: 4; }
.revealed-circle { fill: none; stroke: var(--sky-deep); stroke-width: 4; stroke-dasharray: 11 10; }
.guide-line { stroke: #8faeb8; stroke-width: 4; stroke-dasharray: 9 9; pointer-events: none; }
.circle-line { fill: rgba(220, 238, 243, 0.32); stroke: var(--sky-deep); stroke-width: 5; cursor: grab; }
.circle-line:active { cursor: grabbing; }
.handle { stroke: var(--surface); stroke-width: 4; cursor: grab; }
.handle:active, .probe:active { cursor: grabbing; }
.handle--centre { fill: var(--psy-point, var(--sun)); }
.handle--radius { fill: var(--psy-arm, #4b7c8c); }
.probe { fill: #8eb766; stroke: var(--surface); stroke-width: 4; cursor: grab; }
.probe--on-circle { fill: #db8a4e; }

.stage__hint {
  position: absolute;
  right: 14px;
  bottom: 14px;
  max-width: 210px;
  margin: 0;
  padding: 12px 14px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.92);
  color: var(--subtle);
  font-size: 0.94rem;
  line-height: 1.5;
  pointer-events: none;
}

.stage__count { position: absolute; left: 18px; bottom: 14px; margin: 0; color: var(--psy-text, var(--ink)); font-weight: 800; pointer-events: none; }
.enter-hint { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); display: grid; gap: 2px; min-width: 148px; padding: 16px 14px; border: 3px solid var(--psy-point); border-radius: 18px; background: rgba(0,0,0,.22); color: var(--psy-text); text-align: center; pointer-events: none; }
.enter-hint strong { color: var(--psy-point); font-size: clamp(1.6rem, 5vw, 2.3rem); letter-spacing: .05em; }
.enter-hint span { font-size: 1.05rem; font-weight: 800; }

.sphere-work { background: linear-gradient(165deg, #edfafd, #d9f1ed 54%, #fff4d8); }
.sphere-stage { position: relative; flex: 1; min-height: 430px; overflow: hidden; border: 2px solid #b6d7d5; border-radius: 24px; background: linear-gradient(#cceff5 0 70%, #f8e7be 70%); touch-action: none; }
.sphere-svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.sphere-svg:active { cursor: grabbing; }
.ball-shadow { fill: rgba(8, 43, 51, .42); }
.ball-base { fill: url(#ball-light); stroke: rgba(255,255,255,.9); stroke-width: 5; }
.ball-shading { fill: url(#shine); pointer-events: none; }
.ball-glint { fill: rgba(255,255,255,.55); filter: blur(2px); pointer-events: none; }
.sphere-feature { fill: #ffdc60; stroke: rgba(255,255,255,.75); stroke-width: 3; transition: opacity .08s linear; }
.sphere-feature--1 { fill: #ff668f; }
.sphere-feature--2 { fill: #7457df; }
.sphere-band { fill: none; stroke: rgba(255,255,255,.8); stroke-width: 5; stroke-dasharray: 12 9; stroke-linecap: round; }
.turn-arrow, .turn-arrow-head { fill: none; stroke: #17697a; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.sphere-instruction { position: absolute; top: 18px; left: 18px; display: grid; margin: 0; padding: 10px 14px; border-radius: 14px; color: #174d58; background: rgba(255,255,255,.88); pointer-events: none; }
.sphere-instruction strong { font-size: 1.1rem; }
.sphere-instruction span { font-size: .83rem; font-weight: 700; }
.stamp-tray { position: absolute; right: 14px; bottom: 12px; left: 14px; min-height: 82px; padding: 9px 12px; border: 2px dashed rgba(23,105,122,.4); border-radius: 17px; background: rgba(255,255,255,.9); }
.stamp-tray p { margin: 0 0 6px; color: #315b63; font-size: .8rem; font-weight: 700; }
.stamp-list { display: flex; gap: 7px; min-height: 40px; overflow-x: auto; align-items: center; }
.shadow-stamp { flex: 0 0 39px; width: 39px; height: 39px; display: grid; place-items: center; border: 3px solid #fff; border-radius: 50%; color: #fff; background: var(--stamp); box-shadow: inset -7px -8px 9px rgba(0,0,0,.23), 0 2px 4px rgba(36,52,59,.25); animation: stamp-in .25s cubic-bezier(.2,1.5,.5,1); }
.shadow-stamp span { font-size: .72rem; font-weight: 900; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.stamp-empty { color: #789197; font-size: .82rem; }
.stamp-action { color: #fff; background: #c8386d; }
@keyframes stamp-in { from { opacity: 0; transform: scale(1.7) rotate(-12deg); } to { opacity: 1; transform: scale(1); } }

.discover-button {
  position: absolute;
  right: 14px;
  bottom: 14px;
  max-width: 230px;
  min-height: 46px;
  background: var(--sun);
  box-shadow: 0 2px 0 rgba(36, 52, 59, 0.14);
  font-size: 0.95rem;
}

.tool-dock {
  position: fixed;
  right: max(14px, calc((100vw - 760px) / 2 + 18px));
  bottom: max(14px, env(safe-area-inset-bottom));
  left: max(14px, calc((100vw - 760px) / 2 + 18px));
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 8px 24px rgba(36, 52, 59, 0.14);
}

.tool-dock button { min-width: 0; padding-inline: 8px; font-size: 0.95rem; }
.tool-dock button[aria-pressed="true"] { color: white; background: var(--sky-deep); }

.summary { gap: 18px; }
.summary__body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.summary__actions { display: grid; gap: 10px; }
textarea {
  width: 100%;
  min-height: 180px;
  resize: vertical;
  padding: 16px;
  border: 2px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  color: var(--ink);
  line-height: 1.7;
}

.dialog {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(36, 52, 59, 0.35);
}

.dialog__panel {
  width: min(100%, 420px);
  padding: 28px;
  border-radius: 24px;
  background: var(--surface);
  box-shadow: 0 18px 40px rgba(36, 52, 59, 0.25);
}

.dialog__panel p { line-height: 1.7; }

@media (max-width: 430px) {
  .lesson-grid { grid-template-columns: 1fr; }
  .tool-dock button { font-size: 0.85rem; }
  .stage { min-height: 360px; }
  .sphere-stage { min-height: 390px; }
}
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <section class="startup-message" role="status">
    <p>図形のへんしん実験室を よみこんでいます…</p>
    <noscript>このアプリを表示するには JavaScript を有効にしてください。</noscript>
  </section>
</main>
<script>
/* 先にモジュール（定数・描画）を読み、state.js がその初期値を使える順にする */
/* 共通の道具：論理座標の大きさ・計算・HTMLエスケープ */

/* 作業領域の論理座標。SVGのviewBoxと指の位置変換はこの大きさを正にする */
const BOX = { width: 700, height: 460 };

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function esc(s) {
  return String(s).replace(/[&<>'"]/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;',
  }[c]));
}
/* 課題データ（引き継ぎ書§5.4）。課題を増やすときはここに足すだけで、
   画面側のコードは触らない。module が描画・操作の振り分け先を決める。 */
const lessons = [
  {
    id: 'circle-01',
    module: 'circle',
    title: '円のひみつ 1',
    meta: '同じ長さの点を集めよう',
    prompt: '黄色の点から、青い棒と同じ長さのところに 点をうとう。',
    help: '棒を動かして、Enterかタップで点をうとう。',
    reflectionPrompt: '黄色の点から同じ長さのところに点を打つと、どんな形になった？',
  },
  {
    id: 'sphere-01',
    module: 'sphere',
    title: '球のひみつ',
    meta: '回して、かげを集めよう',
    prompt: '球をいろいろな向きに回して、見えたかげをスタンプしよう。',
    help: '球を指でぐるぐる回そう。向きを変えたら「かげをスタンプ」を押して、形をくらべよう。',
    reflectionPrompt: '球をどの向きから見ても、かげの形はどうなった？',
  },
];
/* 円モジュール：棒を動かして等距離の点を集める実験。
   18こ前後・方位が16区分以上そろうと「円になった」とみなし、
   少し待ってから配色と半径を変えて次の試行を促す。 */

const circlePalettes = [
  { bg: '#16002f', point: '#ffe600', arm: '#21f3c4', text: '#fff' },
  { bg: '#ff145b', point: '#00ffe1', arm: '#1700ff', text: '#fff' },
  { bg: '#00d9a6', point: '#5c00ff', arm: '#ffea00', text: '#102a2b' },
  { bg: '#ff6a00', point: '#00eaff', arm: '#1900ff', text: '#fff' },
];

let armDrag = null; // 'centre' | 'radius' | 'rotate'（ドラッグ中の役割）

function renderCircleWork() {
  const c = state.geometry.center;
  const p = state.geometry.radiusPoint;
  const dots = state.dots
    .map(d => `<circle class="placed-dot" cx="${d.x}" cy="${d.y}" r="9"/>`)
    .join('');
  const hint = state.activeTool === 'move'
    ? `<div class="enter-hint"><strong>ENTER</strong><span>で 点をうつ</span></div>
       <p class="stage__count">${state.dots.length}こ</p>`
    : '<p class="stage__hint">ペンで しるしや ことばを かこう。</p>';
  return `<section class="app-shell work psychedelic" style="--psy-bg:${state.palette.bg};--psy-point:${state.palette.point};--psy-arm:${state.palette.arm};--psy-text:${state.palette.text}">
    ${workHeader()}
    <div class="stage stage--${state.activeTool}" id="stage">
      <svg class="stage__svg" id="geometry-svg" viewBox="0 0 ${BOX.width} ${BOX.height}">
        ${dots}
        <line class="radius-arm" x1="${c.x}" y1="${c.y}" x2="${p.x}" y2="${p.y}"/>
        <circle class="handle handle--centre" cx="${c.x}" cy="${c.y}" r="16"/>
        <circle class="handle handle--radius" cx="${p.x}" cy="${p.y}" r="17"/>
      </svg>
      <canvas class="stage__ink" id="ink-canvas"></canvas>
      ${hint}
    </div>
    <nav class="tool-dock">
      <button aria-pressed="${state.activeTool === 'move'}" data-action="tool" data-tool="move">うごかす</button>
      <button aria-pressed="${state.activeTool === 'pen'}" data-action="tool" data-tool="pen">かく</button>
      <button data-action="undo">もどす</button>
    </nav>
    ${helpDialog()}
  </section>`;
}

function setupCircle() {
  const svg = document.querySelector('#geometry-svg');
  const canvas = document.querySelector('#ink-canvas');
  resizeAndDrawInk(canvas);
  if (state.activeTool !== 'move') {
    canvas.addEventListener('pointerdown', e => beginInkStroke(e, canvas));
    return;
  }
  svg.addEventListener('pointerdown', e => {
    e.preventDefault();
    const q = svgPoint(e, svg);
    armDrag = distance(q, state.geometry.center) < 34 ? 'centre'
      : distance(q, state.geometry.radiusPoint) < 34 ? 'radius' : 'rotate';
    armMove(q, svg);
    if (svg.setPointerCapture) svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', e => {
    if (armDrag || !e.buttons) armMove(svgPoint(e, svg), svg);
  });
  svg.addEventListener('pointerup', () => {
    if (armDrag) {
      armDrag = null;
      placeDot();
    }
  });
  svg.addEventListener('pointercancel', () => { armDrag = null; });
}

/* 指・マウスの位置をSVGの論理座標へ。viewBox は等比（meet）で拡大縮小＋余白が
   出るので、実スケールと余白を引いてから変換する（x/y を別々に伸ばすと
   指と棒がずれる） */
function svgPoint(e, svg) {
  const r = svg.getBoundingClientRect();
  const s = Math.min(r.width / BOX.width, r.height / BOX.height);
  const ox = (r.width - BOX.width * s) / 2;
  const oy = (r.height - BOX.height * s) / 2;
  return {
    x: clamp((e.clientX - r.left - ox) / s, 0, BOX.width),
    y: clamp((e.clientY - r.top - oy) / s, 0, BOX.height),
  };
}

/* 押した場所で役割を分ける：黄色（中心）はそのまま動かす、青（先）は半径を
   伸ばし縮め、それ以外は棒をその方向へ向ける。 */
function armMove(q, svg) {
  const c = state.geometry.center;
  const p = state.geometry.radiusPoint;
  if (armDrag === 'centre') {
    state.geometry.radiusPoint = { x: p.x + q.x - c.x, y: p.y + q.y - c.y };
    state.geometry.center = { x: q.x, y: q.y };
  } else if (armDrag === 'radius') {
    const dx = q.x - c.x;
    const dy = q.y - c.y;
    const l = Math.hypot(dx, dy) || 1;
    const rad = clamp(l, 40, 330);
    state.geometry.radiusPoint = { x: c.x + dx / l * rad, y: c.y + dy / l * rad };
  } else {
    const dx = q.x - c.x;
    const dy = q.y - c.y;
    const l = Math.hypot(dx, dy);
    if (l < 10) return;
    const rad = distance(c, p);
    state.geometry.radiusPoint = { x: c.x + dx / l * rad, y: c.y + dy / l * rad };
  }
  const nc = state.geometry.center;
  const np = state.geometry.radiusPoint;
  const a = svg.querySelector('.radius-arm');
  const hr = svg.querySelector('.handle--radius');
  const hc = svg.querySelector('.handle--centre');
  a.setAttribute('x1', nc.x);
  a.setAttribute('y1', nc.y);
  a.setAttribute('x2', np.x);
  a.setAttribute('y2', np.y);
  hr.setAttribute('cx', np.x);
  hr.setAttribute('cy', np.y);
  hc.setAttribute('cx', nc.x);
  hc.setAttribute('cy', nc.y);
}

function placeDot() {
  const now = performance.now();
  if (now - state.lastPlacedAt < 80) return;
  state.lastPlacedAt = now;
  const p = state.geometry.radiusPoint;
  if (state.dots.some(d => distance(d, p) < 22)) return;
  remember();
  state.dots.push({ x: p.x, y: p.y });
  if (state.dots.length >= 18 && new Set(state.dots.map(d => Math.floor(
    (((Math.atan2(d.y - state.geometry.center.y, d.x - state.geometry.center.x) + Math.PI * 2) % (Math.PI * 2)) / (Math.PI * 2)) * 18
  ))).size >= 16) {
    schedulePaletteChange();
  }
  render();
}

function schedulePaletteChange() {
  if (state.completionTimer) return;
  state.completionTimer = setTimeout(() => {
    state.completionTimer = null;
    if (state.screen !== 'work' || state.lesson.module !== 'circle') return;
    const choices = circlePalettes.filter(p => p.bg !== state.palette.bg);
    state.palette = choices[Math.floor(Math.random() * choices.length)];
    const r = 95 + Math.random() * 75;
    state.geometry.radiusPoint = { x: state.geometry.center.x + r, y: state.geometry.center.y };
    state.dots = [];
    render();
  }, 700);
}

/* 円の実験中は Enter・スペース・文字キーでも点を打てる（連打しやすさのため） */
function circleKeydown(e) {
  if (state.screen !== 'work' || state.lesson.module !== 'circle'
      || state.activeTool !== 'move' || state.helpOpen || e.repeat) return;
  const safe = e.key === 'Enter' || e.key === ' ' || e.code === 'NumpadEnter'
    || (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey);
  if (safe) {
    e.preventDefault();
    placeDot();
  }
}
/* 球モジュール：模様つきの球を指で回し、向きごとの「かげ」を
   色違いスタンプとして集める実験。 */

/* 球面上の模様（単位球の方向ベクトル）。回転で見え方が変わる目印 */
const sphereFeatures = [
  [-0.72, -0.35, 0.60], [-0.28, -0.62, 0.73], [0.20, -0.48, 0.85], [0.64, -0.28, 0.72],
  [-0.54, 0.12, 0.83], [-0.08, 0.02, 0.99], [0.48, 0.12, 0.87], [-0.72, 0.48, 0.50],
  [-0.25, 0.54, 0.80], [0.28, 0.58, 0.76], [0.70, 0.40, 0.58], [0.05, 0.78, 0.55],
];

/* スタンプの色は回収順にぐるっと巡回する */
const stampColors = ['#ff4f87', '#6c5ce7', '#00a884', '#ff8a00', '#1687d9', '#d23fb8'];

function renderSphereWork() {
  const features = sphereFeatures
    .map((v, i) => `<circle class="sphere-feature sphere-feature--${i % 3}" data-vector="${v.join(',')}" r="18"/>`)
    .join('');
  const stamps = state.stamps
    .map((s, i) => `<div class="shadow-stamp" style="--stamp:${s.color}" aria-label="${i + 1}このかげ"><span>${i + 1}</span></div>`)
    .join('');
  return `<section class="app-shell work sphere-work">
    ${workHeader()}
    <div class="sphere-stage" id="stage">
      <svg class="sphere-svg" id="sphere-svg" viewBox="0 0 ${BOX.width} ${BOX.height}" role="img" aria-label="指で回せる、模様と陰影のある球">
        <defs>
          <radialGradient id="ball-light" cx="30%" cy="22%" r="78%">
            <stop offset="0" stop-color="#fff9c9"/>
            <stop offset=".2" stop-color="#71e1d0"/>
            <stop offset=".62" stop-color="#168fa2"/>
            <stop offset="1" stop-color="#073852"/>
          </radialGradient>
          <radialGradient id="shine" cx="32%" cy="25%" r="70%">
            <stop offset="0" stop-color="#fff" stop-opacity=".88"/>
            <stop offset=".25" stop-color="#fff" stop-opacity=".12"/>
            <stop offset=".75" stop-color="#001d35" stop-opacity="0"/>
            <stop offset="1" stop-color="#001322" stop-opacity=".72"/>
          </radialGradient>
          <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
          <clipPath id="ball-clip"><circle cx="350" cy="208" r="142"/></clipPath>
        </defs>
        <ellipse class="ball-shadow" cx="370" cy="382" rx="150" ry="27" filter="url(#blur)"/>
        <circle class="ball-base" cx="350" cy="208" r="142"/>
        <g clip-path="url(#ball-clip)">${features}<path class="sphere-band" id="sphere-band"/></g>
        <circle class="ball-shading" cx="350" cy="208" r="142"/>
        <ellipse class="ball-glint" cx="304" cy="154" rx="34" ry="21" transform="rotate(-35 304 154)"/>
        <path class="turn-arrow" d="M190 100 C250 34 446 28 516 98"/>
        <path class="turn-arrow-head" d="m501 77 18 22-28 5"/>
      </svg>
      <p class="sphere-instruction"><strong>ゆびで ぐるぐる</strong><span>模様のうごきを見よう</span></p>
      <div class="stamp-tray">
        <p>あつめた かげ <strong>${state.stamps.length}こ</strong></p>
        <div class="stamp-list">${stamps || '<span class="stamp-empty">まだないよ</span>'}</div>
      </div>
    </div>
    <nav class="tool-dock">
      <button aria-pressed="true" data-action="tool" data-tool="move">まわす</button>
      <button class="stamp-action" data-action="stamp-shadow">かげをスタンプ</button>
      <button data-action="undo">もどす</button>
    </nav>
    ${helpDialog()}
  </section>`;
}

function setupSphere() {
  const svg = document.querySelector('#sphere-svg');
  updateSphereVisual();
  let last = null;
  let moved = false;
  svg.addEventListener('pointerdown', e => {
    e.preventDefault();
    remember();
    last = { x: e.clientX, y: e.clientY };
    moved = false;
    if (svg.setPointerCapture) svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', e => {
    if (!last) return;
    const dx = e.clientX - last.x;
    const dy = e.clientY - last.y;
    if (Math.abs(dx) + Math.abs(dy) > 1) moved = true;
    state.sphere.yaw += dx * 0.012;
    state.sphere.pitch = clamp(state.sphere.pitch - dy * 0.009, -1.15, 1.15);
    last = { x: e.clientX, y: e.clientY };
    updateSphereVisual();
  });
  const end = () => {
    last = null;
    if (moved) render();
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
}

function rotateVector([x, y, z]) {
  const cy = Math.cos(state.sphere.yaw);
  const sy = Math.sin(state.sphere.yaw);
  const cp = Math.cos(state.sphere.pitch);
  const sp = Math.sin(state.sphere.pitch);
  const x1 = x * cy + z * sy;
  const z1 = -x * sy + z * cy;
  return [x1, y * cp - z1 * sp, y * sp + z1 * cp];
}

function updateSphereVisual() {
  document.querySelectorAll('.sphere-feature').forEach(el => {
    const [x, y, z] = rotateVector(el.dataset.vector.split(',').map(Number));
    const depth = clamp((z + 1) / 2, 0, 1);
    el.setAttribute('cx', 350 + x * 132);
    el.setAttribute('cy', 208 + y * 132);
    el.setAttribute('r', 10 + depth * 16);
    el.style.opacity = z < -0.12 ? 0 : (0.35 + depth * 0.65);
  });
  const points = [];
  for (let i = 0; i <= 44; i++) {
    const a = i / 44 * Math.PI * 2;
    const v = rotateVector([Math.cos(a), 0, Math.sin(a)]);
    if (v[2] > -0.05) points.push(`${points.length ? 'L' : 'M'} ${350 + v[0] * 139} ${208 + v[1] * 139}`);
  }
  const band = document.querySelector('#sphere-band');
  if (band) band.setAttribute('d', points.join(' '));
}

function stampShadow() {
  remember();
  const color = stampColors[state.stamps.length % stampColors.length];
  state.stamps.push({ yaw: state.sphere.yaw, pitch: state.sphere.pitch, color });
  if (state.stamps.length > 12) state.stamps.shift();
  render();
}
/* 状態の唯一の正（引き継ぎ書§5.3）と、最大20件の「もどす」履歴。
   DOMから状態を逆算しない。画面側は render() でここを描くだけ。 */

const state = {
  screen: 'home',           // home | intro | work | summary
  lesson: lessons[0],
  activeTool: 'move',       // move | pen
  reflection: '',
  helpOpen: false,
  geometry: initialGeometry(),
  dots: [],                 // 円：置いた点
  strokes: [],              // 手書きの線（座標列の配列）
  history: [],
  palette: circlePalettes[0],
  completionTimer: null,    // 円がそろった後の色替えタイマー
  lastPlacedAt: 0,
  sphere: { yaw: 0.25, pitch: -0.18 },
  stamps: [],               // 球：集めたかげ
};

function initialGeometry() {
  return { center: { x: 350, y: 230 }, radiusPoint: { x: 500, y: 230 } };
}

const copyGeometry = () => JSON.parse(JSON.stringify(state.geometry));

/* 課題カードを開き直すたびに実験状態を初期値へ戻す */
function resetWorkState(lesson) {
  state.lesson = lesson;
  state.activeTool = 'move';
  state.reflection = '';
  state.helpOpen = false;
  state.history = [];
  state.dots = [];
  state.strokes = [];
  state.stamps = [];
  state.geometry = initialGeometry();
  state.palette = circlePalettes[0];
  state.sphere = { yaw: 0.25, pitch: -0.18 };
  if (state.completionTimer) {
    clearTimeout(state.completionTimer);
    state.completionTimer = null;
  }
}

function remember() {
  state.history.push({
    geometry: copyGeometry(),
    dots: state.dots.map(d => ({ ...d })),
    strokes: state.strokes.length,
    sphere: { ...state.sphere },
    stamps: state.stamps.map(s => ({ ...s })),
  });
  if (state.history.length > 20) state.history.shift();
}

function undo() {
  const p = state.history.pop();
  if (!p) return;
  state.geometry = p.geometry;
  state.dots = p.dots;
  state.strokes = state.strokes.slice(0, p.strokes);
  state.sphere = p.sphere || state.sphere;
  state.stamps = p.stamps || state.stamps;
  render();
}
/* 手書きレイヤー（Canvas）。図形のSVGの上に重ねるだけで、
   書いた線を図形として認識・補正はしない（引き継ぎ書§5.2）。 */

function beginInkStroke(e, c) {
  e.preventDefault();
  remember();
  const st = [];
  const add = x => {
    const r = c.getBoundingClientRect();
    st.push({ x: x.clientX - r.left, y: x.clientY - r.top });
    drawInk(c, st);
  };
  add(e);
  if (c.setPointerCapture) c.setPointerCapture(e.pointerId);
  const move = x => add(x);
  const up = () => {
    state.strokes.push(st);
    window.removeEventListener('pointermove', move);
    render();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up, { once: true });
}

function resizeAndDrawInk(c) {
  const s = devicePixelRatio || 1;
  const r = c.getBoundingClientRect();
  c.width = Math.max(1, r.width * s);
  c.height = Math.max(1, r.height * s);
  c.getContext('2d').setTransform(s, 0, 0, s, 0, 0);
  drawInk(c);
}

function drawInk(c, current = []) {
  const x = c.getContext('2d');
  const r = c.getBoundingClientRect();
  x.clearRect(0, 0, r.width, r.height);
  x.lineCap = 'round';
  x.lineWidth = 4;
  x.strokeStyle = '#24343b';
  [...state.strokes, current].forEach(st => {
    if (!st.length) return;
    x.beginPath();
    st.forEach((p, i) => (i ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y)));
    x.stroke();
  });
}
/* 図形と手書きを1枚のPNGとして保存。いま出ているSVGをそのまま写すので、
   点・棒・球の見た目が紙そのまま残る（docs/spec にある Phase 3 の保存）。 */
function savePng() {
  const svg = document.querySelector('#stage svg');
  if (!svg) return;
  const ink = document.querySelector('#ink-canvas');
  const r = svg.getBoundingClientRect();
  const clone = svg.cloneNode(true);
  clone.setAttribute('width', r.width);
  clone.setAttribute('height', r.height);
  /* 単体の画像にするので、CSSから計算した色・線を属性として書き写す */
  const src = svg.querySelectorAll('*');
  const dst = clone.querySelectorAll('*');
  src.forEach((el, i) => {
    const cs = getComputedStyle(el);
    for (const p of ['fill', 'fill-opacity', 'stroke', 'stroke-width', 'stroke-linecap',
      'stroke-linejoin', 'stroke-dasharray', 'stroke-dashoffset', 'opacity', 'filter']) {
      dst[i].setAttribute(p, cs.getPropertyValue(p));
    }
  });
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    const sc = 2;
    cv.width = r.width * sc;
    cv.height = r.height * sc;
    const x = cv.getContext('2d');
    const bg = getComputedStyle(svg.parentElement).backgroundColor;
    x.fillStyle = (bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent') ? '#f7f5ef' : bg;
    x.fillRect(0, 0, cv.width, cv.height);
    x.drawImage(img, 0, 0, cv.width, cv.height);
    if (ink) x.drawImage(ink, 0, 0, cv.width, cv.height);
    cv.toBlob(b => {
      if (!b) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = state.lesson.id + '.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    });
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
}
/* 画面シェル：遷移（ホーム→導入→実験→まとめ）、共通の頭・操作帯、
   ボタンの data-action の振り分け。モジュール固有の中身は circle.js / sphere.js。 */

const app = () => document.querySelector('#app');

function render() {
  app().innerHTML = {
    home: renderHome,
    intro: renderIntro,
    work: renderWork,
    summary: renderSummary,
  }[state.screen]();
  bindEvents();
}

function renderHome() {
  return `<section class="app-shell home">
    <div>
      <p class="eyebrow">さんすう</p>
      <h1>図形のへんしん<br>実験室</h1>
      <p class="lead">うごかして、みつけよう。</p>
    </div>
    <div class="lesson-grid">${lessons.map(l => `
      <button class="lesson-card" data-action="open-lesson" data-lesson-id="${l.id}">
        <span class="lesson-card__icon">${l.module === 'sphere' ? '●' : '○'}</span>
        <span class="lesson-card__title">${l.title}</span>
        <span class="lesson-card__meta">${l.meta}</span>
      </button>`).join('')}
    </div>
  </section>`;
}

function renderIntro() {
  return `<section class="app-shell intro">
    <div class="topbar"><button class="back" data-action="go-home">← もどる</button></div>
    <div class="intro__body">
      <p class="eyebrow">さんすう　円と球</p>
      <h2>${state.lesson.title}</h2>
      <p class="prompt">${state.lesson.prompt}</p>
    </div>
    <button class="primary" data-action="start-work">はじめる</button>
  </section>`;
}

function workHeader() {
  return `<div class="topbar">
      <button class="back" data-action="go-intro">← もどる</button>
      <div class="topbar__actions">
        <button class="next" data-action="save-png">ほぞん</button>
        <button class="next" data-action="go-summary">まとめへ</button>
        <button class="help" data-action="open-help">?</button>
      </div>
    </div>
    <p class="work__question">${state.lesson.prompt}</p>`;
}

function renderWork() {
  return state.lesson.module === 'sphere' ? renderSphereWork() : renderCircleWork();
}

function helpDialog() {
  return state.helpOpen
    ? `<div class="dialog"><div class="dialog__panel">
        <h2>つかいかた</h2>
        <p>${state.lesson.help}</p>
        <button class="primary" data-action="close-help">わかった</button>
      </div></div>`
    : '';
}

function renderSummary() {
  return `<section class="app-shell summary">
    <div class="topbar"><button class="back" data-action="go-work">← もどる</button></div>
    <div class="summary__body">
      <p class="eyebrow">まとめ</p>
      <h2>分かったことを<br>書こう</h2>
      <p class="prompt">${state.lesson.reflectionPrompt}</p>
      <textarea id="reflection" maxlength="240" placeholder="たとえば、中心から…">${esc(state.reflection)}</textarea>
    </div>
    <div class="summary__actions"><button class="primary" data-action="finish">おわる</button></div>
  </section>`;
}

function bindEvents() {
  app().querySelectorAll('[data-action]').forEach(el =>
    el.addEventListener('click', () => handleAction(el.dataset)));
  const r = document.querySelector('#reflection');
  if (r) r.addEventListener('input', e => { state.reflection = e.target.value; });
  if (state.screen === 'work') setupWorkSurface();
}

function setupWorkSurface() {
  if (state.lesson.module === 'sphere') {
    setupSphere();
    return;
  }
  setupCircle();
}

function handleAction(d) {
  switch (d.action) {
    case 'open-lesson':
      resetWorkState(lessons.find(l => l.id === d.lessonId) || lessons[0]);
      state.screen = 'intro';
      break;
    case 'go-home': state.screen = 'home'; break;
    case 'go-intro': state.screen = 'intro'; break;
    case 'start-work': state.screen = 'work'; break;
    case 'go-work': state.screen = 'work'; break;
    case 'go-summary': state.screen = 'summary'; break;
    case 'tool': state.activeTool = d.tool; break;
    case 'stamp-shadow': stampShadow(); return;
    case 'save-png': savePng(); return;
    case 'undo': undo(); return;
    case 'open-help': state.helpOpen = true; break;
    case 'close-help': state.helpOpen = false; break;
    case 'finish': state.screen = 'home'; break;
    default: return;
  }
  render();
}
/* 起動：キーボードの点打ちと最初の描画 */
document.addEventListener('keydown', circleKeydown);
render();
</script>
